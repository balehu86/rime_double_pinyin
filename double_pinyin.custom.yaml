patch:
  # 扩充符号库
  #punctuator/import_preset: symbols
  #recognizer/patterns/punct: "^/([A-Z|a-z]*|[0-9]|10)$"

  # 自动造句 (阴阳鱼☯️️ 图标)
  # translator/enable_sentence: true

  # （按需选择）清空 preedit_format 中的内容，输入时显示双拼编码
  translator/preedit_format: []
  #下面5行是启用整句输入
  translator/contextual_suggestions: true  # 启用上下文联想
  translator/enabled: true  # 启用翻译器（一般用于整句输入）
  # menu/page_size: 9  # 候选词每页显示的数量
  translator/enable_user_dict: true  # 启用用户词典
  translator/enable_sentence: true  # 启用整句输入
  emoji/tips: all                  # 转换提示：all 都显示 | char 仅单字显示 | none 不显示。
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/

  engine/translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator    # 时间、日期、星期
    - lua_translator@*lunar              # 农历
    - lua_translator@*uuid               # UUID
    - lua_translator@*search_anywhere
    - table_translator@custom_phrase     # 自定义短语 custom_phrase_double.txt
    - table_translator@melt_eng          # 英文输入
    - table_translator@cn_en             # 中英混合词汇
    - table_translator@radical_lookup    # 部件拆字反查
    - lua_translator@*unicode            # Unicode
    - lua_translator@*number_translator  # 数字、金额大写
    - lua_translator@*calc_translator    # 计算器
    - lua_translator@*force_gc           # 暴力 GC

